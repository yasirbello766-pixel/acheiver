<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuiz - Advanced Learning Hub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>

    <!-- Toast Container for Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Main Layout Grid Wrapper -->
    <div class="app-container">
        
        <!-- Sidebar Navigation Area -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🎓</span>
                <span class="brand-text">EduQuiz</span>
            </div>
            <nav class="sidebar-menu">
                <button class="nav-link active" data-target="dashboard">
                    <span class="nav-icon">📊</span> <span class="nav-text">Dashboard</span>
                </button>
                <button class="nav-link" data-target="quizzes">
                    <span class="nav-icon">📝</span> <span class="nav-text">Take Quiz</span>
                </button>
                <button class="nav-link" data-target="leaderboard">
                    <span class="nav-icon">🏆</span> <span class="nav-text">Leaderboard</span>
                </button>
                <button class="nav-link" data-target="admin">
                    <span class="nav-icon">🛡️</span> <span class="nav-text">Admin Portal</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <div class="user-badge">
                    <div class="avatar">U</div>
                    <div class="user-info">
                        <span class="user-name">Guest Student</span>
                        <span class="user-role">Premium Tier</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Viewport and Content Container -->
        <div class="main-layout">
            <header class="app-header">
                <div class="header-left">
                    <button id="mobile-menu-toggle" class="mobile-toggle" aria-label="Toggle Menu">☰</button>
                    <h1 id="page-title" class="page-title">Dashboard</h1>
                </div>
                <div class="header-right">
                    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                        <span class="theme-icon">☀️</span>
                    </button>
                </div>
            </header>

            <!-- Reactive Screen Mount Node -->
            <main id="app-view" class="view-viewport"></main>
        </div>
    </div>

    <!-- Main Application Scripts Entrypoint Layer -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
