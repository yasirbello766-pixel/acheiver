    <form action="process.php" method="post">
      <label class="label">Full name</label>
      <input type="text" name="fullname" required class="input" />
      <label class="label">Email</label>
      <input type="email" name="email" required class="input" />
      <label class="label">Password</label>
      <input type="password" name="password" required class="input" />
      <label class="label">Date of birth</label>
      <input type="date" name="dob" required class="input" />
      <label class="label">Gender</label>
      <input type="radio" name="gender" value="Female" /> Female
      <input type="radio" name="gender" value="Male" /> Male

        <option value="FCT">FCT</option>
      </select>
      <label class="label">Hobbies</label>
      <textarea name="hobbies" class="input"></textarea>
      <label class="label">Upload your profile picture</label>
      <input type="file" name="profile_picture" class="input" />
      <input type="checkbox" name="terms" required /> I agree to the terms and
      conditions
      <button type="submit">Register</button>
      <button type="reset">Reset</button>
